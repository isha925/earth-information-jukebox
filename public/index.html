<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Information Jukebox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="earth-interface">
    <div id="earthScene" class="earth-scene" role="img" aria-label="NASA Earth Information Center visualization"></div>
    <div class="scene-darkening" aria-hidden="true"></div>

    <section class="interface-content">
      <header class="top-bar">
        <p class="brand">Earth Information Jukebox</p>
        <p class="source-pill">NASA SVS EIC · POWER · GISTEMP</p>
      </header>

      <div class="stage">
        <p class="eyebrow">NASA Space Apps 2026</p>
        <h1>Hear Earth change.</h1>
        <p id="paMessage" class="lead">
          Pair NASA Earth Information Center visuals with live NASA data sonification.
          Ask about Kathmandu rainfall or global temperature.
        </p>

        <form id="askForm" class="ask-form">
          <label class="sr-only" for="askInput">Ask the jukebox</label>
          <input
            id="askInput"
            name="ask"
            type="text"
            autocomplete="off"
            placeholder="Ask: Kathmandu rain yesterday / 2026-11-10"
            required
          >
          <button id="askButton" type="submit">Ask</button>
          <button id="talkButton" type="button">Talk</button>
        </form>

        <div class="quick-actions">
          <button id="kathmanduBtn" type="button" data-question="Kathmandu rainfall">
            Hear Kathmandu rain
          </button>
          <button id="gistempBtn" type="button" data-question="global temperature">
            Hear global temperature
          </button>
        </div>

        <p id="statusMessage" class="status" aria-live="polite"></p>
        <div id="dataDisplay" class="data-display" aria-live="polite"></div>
        <p id="citationLine" class="citation"></p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
